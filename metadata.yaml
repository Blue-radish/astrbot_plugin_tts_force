name: astrbot_plugin_tts_force
display_name: 说一声就念给你听
short_desc: 按对方意愿与会话节奏决定是否语音：拒绝优先、点名一定念、主动语音共享一套约束、内容不会因为转语音而丢失
desc: >-
  先尊重意愿，再谈主动语音。对方说“别发语音”“我在开会”就进文字模式（模型标记和随机都挡住），
  说“这句念给我听”就一定念（并保留含代码/链接的文字），说“接下来用语音”就提高主动语音倾向并且
  缩短间隔，问“发语音怎么设置”不触发。主动语音遇到代码、链接、清单、长数字一律不发（念掉等于弄丢），
  并且共享一套约束：群白名单、内容检查、最小间隔、字数上限；主动语音合成超过 40 秒就先发文字。
  合成期间对方改主意或已经继续说话，那条旧语音会被丢弃。语音由 AstrBot 的 TTS 提供商合成，
  设置页用选择器挑，`/语音测试` 可真跑一次自检。
version: 2.3.0
author: Ray
repo: https://github.com/Blue-radish/astrbot_plugin_tts_force
astrbot_version: ">=4.28.1"
