name: astrbot_plugin_tts_force
display_name: 说一句就念给你听
short_desc: 模型调用 send_voice 就能把一句话变成语音发出去；插件只负责可靠地合成、校验和发送
desc: >-
  只有一个入口：模型调用 `send_voice(text)`，插件合成后作为独立消息直接发出音频，
  工具结果会提醒模型别再用文字重复同一句。什么时候该念由模型结合上下文判断——
  闲聊、问候、情绪表达适合简短语音，技术讨论、代码和需要复制的内容用文字；
  用户明确要求「念给我听」时一定要调。插件的职责是可靠：单次字数上限（超限拒绝并回给模型
  实际长度，不截断句子）、合成超时、提供商解析与回退说明、音频文件校验（不存在/空/坏 WAV
  都不发）、同会话不并发合成、失败原因脱敏后回给模型。私聊群聊都能用。
  `/语音测试` 可绕开模型直接合成一句，用来分清是 TTS 服务坏了还是模型没调用工具。
version: 3.0.0
author: Ray
repo: https://github.com/Blue-radish/astrbot_plugin_tts_force
astrbot_version: ">=4.28.1"
