name: astrbot_plugin_tts_force
display_name: 念给你听
short_desc: 模型调用 send_voice 就能把一句话变成语音发出去；插件只负责可靠地合成、校验和发送
desc: >-
  为模型提供一个 `send_voice(text)` 工具：模型结合人设、上下文和用户当前要求，决定把哪句简短内容
  用语音说，插件负责合成并作为一条独立消息发送到当前私聊或群聊。成功时用户只收到语音；
  失败时把原因返回模型，由模型决定后续回复。
  生活闲聊、早晚问候、道谢和情绪表达适合简短语音；技术长文、代码、链接以及需要复制回看的信息优先文字。
  插件保证：单次字数上限（超限拒绝并回给模型实际长度，不截断句子）、合成与发送超时分开报告、
  音频校验（不存在/空/被截断的 WAV 都不发）、同会话不并发合成（工具与 `/语音测试` 共用一条流程）、
  错误脱敏后回给模型；指定的提供商失效会直接报配置错误，不会改用其他服务。
  `/语音测试` 可绕开模型直接合成一句，用来验证语音服务和发送链路。
version: 3.3.1
author: Ray
repo: https://github.com/Blue-radish/astrbot_plugin_tts_force
astrbot_version: ">=4.28.1"
# 语音用 Record 组件发，OneBot v11 才收
support_platforms:
  - aiocqhttp
