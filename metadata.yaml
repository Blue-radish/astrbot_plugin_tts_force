name: astrbot_plugin_tts_force
display_name: 说一声就念给你听
short_desc: 按对方意愿和节奏决定是否语音：拒绝优先、点名一定念、主动语音共用一套约束
desc: >-
  先尊重意愿，再谈主动语音。对方说“别发语音”“我在开会”就进文字模式（模型标记和随机都挡住），
  说“这句念给我听”就一定念（放宽字数），说“接下来用语音”就提高主动语音倾向，问“发语音怎么设置”
  不触发。模型标记和随机共享一套约束：群白名单、内容检查（链接/代码/清单/大段英文数字不念）、
  主动语音最小间隔、字数上限；主动语音合成超过 40 秒就先发文字，不让对方干等。
  合成前删掉括号动作、【】注释、markdown 与代码块；任何失败都保留文字回复。
version: 2.2.0
author: Ray
