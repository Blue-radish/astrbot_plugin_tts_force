name: astrbot_plugin_tts_force
display_name: 说一声就念给你听
short_desc: 模型按内容自己判断发不发语音，日常闲聊按概率念，括号动作与代码不念
desc: >-
  三条路决定这一条发不发语音：用户点名（“发语音”“念给我听”）> 模型在回复最前面写 <语音> > 按
  random_rate 掷骰子。插件会把“什么时候该用语音”写进系统提示词（可在设置里关掉），让模型按内容判断
  而不是纯随机；掷骰子前先过硬门槛：字数上限、带链接/代码/清单/大段英文数字的不念，随机之间还有最小
  间隔，群聊只认白名单（私聊总是允许）。合成前会删掉括号里的动作神态、【】注释和 markdown 符号。
  任何一步失败都保留原来的文字回复。
version: 2.1.0
author: Ray
repo: ""
astrbot_version: ">=4.28.1"
